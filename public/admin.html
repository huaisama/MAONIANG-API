<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · ReplyAPI</title>
<style>
  :root{
    --bg:#0a0e17;--panel:#0f1623;--panel-2:#0b1120;--line:rgba(148,163,184,.15);--line-2:rgba(148,163,184,.28);
    --text:#e6edf8;--muted:#8b98ad;--dim:#5c6b80;--accent:#7c5cff;--green:#22d3a6;--warn:#fbbf24;--red:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:rgba(124,92,255,.35)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:#a78bfa}

  .app{display:flex;flex-direction:column;height:100%}

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(15,22,35,.9);backdrop-filter:blur(8px);flex:none}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#7c5cff,#22d3a6);display:grid;place-items:center;color:#08111a;font-weight:800;font-size:13px}
  .top .sep{width:1px;height:20px;background:var(--line-2)}
  .conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .conn .d{width:7px;height:7px;border-radius:50%;background:var(--red)}
  .conn .d.on{background:var(--green);box-shadow:0 0 0 4px rgba(34,211,166,.12)}
  .stat{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-left:4px}
  .stat b{color:#cbd5e1;font-weight:600;font-family:var(--mono)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tbtn{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 11px;border-radius:8px;
    background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:#d4dceb;cursor:pointer
  }
  .tbtn:hover{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.45)}
  .tbtn.primary{background:linear-gradient(135deg,#7c5cff,#6b4bf5);border-color:transparent;color:#fff}
  .tbtn.primary:hover{filter:brightness(1.08)}
  .tbtn.danger:hover{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.5);color:#fca5a5}
  .tbtn:disabled{opacity:.45;cursor:not-allowed}
  #soundBtn.off{opacity:.55}

  /* 主区 */
  .main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);flex:1;min-height:0}
  @media(max-width:900px){.main{grid-template-columns:minmax(0,280px) minmax(0,1fr)}}

  /* 左：队列 */
  .queue{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;min-width:0;background:var(--panel-2)}
  .qtabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex:none;min-width:0}
  .qtab{flex:1;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-align:center}
  .qtab .n{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:4px}
  .qtab.on{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.35);color:#d8ccff}
  .qtab.on .n{color:#b7a6ff}
  .qlist{flex:1;overflow:auto;padding:8px}
  .qsearch{padding:0 10px 8px;flex:none}
  .qsearch input{width:100%;background:#080d16;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:#dbe4f3;outline:none;font-family:inherit}
  .qsearch input:focus{border-color:rgba(124,92,255,.55);box-shadow:0 0 0 3px rgba(124,92,255,.1)}
  .qsearch input::-webkit-search-cancel-button{filter:invert(.6)}
  .qcount{font-size:11px;color:#4b5a70;padding:0 12px 6px}
  .qempty{padding:40px 18px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.9}
  .qempty .big{font-size:22px;display:block;margin-bottom:8px;opacity:.6}

  .item{padding:10px 11px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:6px;position:relative;transition:.12s}
  .item:hover{background:rgba(255,255,255,.03)}
  .item.sel{background:rgba(124,92,255,.13);border-color:rgba(124,92,255,.45)}
  .item .l1{display:flex;align-items:center;gap:7px;min-width:0}
  .verb{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex:none}
  .v-GET{color:#7dd3fc;background:rgba(56,189,248,.14)}
  .v-POST{color:#86efac;background:rgba(34,197,94,.14)}
  .v-PUT,.v-PATCH{color:#fcd34d;background:rgba(251,191,36,.14)}
  .v-DELETE{color:#fca5a5;background:rgba(248,113,113,.14)}
  .v-OPTIONS,.v-HEAD{color:#cbd5e1;background:rgba(148,163,184,.14)}
  .item .path{font-family:var(--mono);font-size:11.5px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .l2{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--dim)}
  .item .l2 .time{margin-left:auto;font-family:var(--mono)}
  .badge{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line-2)}
  .badge.wait{color:#fcd34d;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1)}
  .badge.hot{color:#fca5a5;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
  .badge.ok{color:#6ee7b7;border-color:rgba(34,211,166,.35);background:rgba(34,211,166,.1)}
  .badge.to{color:#94a3b8;border-color:var(--line-2)}
  .badge.cancel{color:#94a3b8;border-color:var(--line-2)}
  .item .preview{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.new{animation:flash 1.4s ease-out}
  @keyframes flash{0%{background:rgba(34,211,166,.22)}100%{background:transparent}}

  /* 右：详情 */
  .detail{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .empty{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:30px}
  .empty .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#4b5a70;margin-bottom:12px}
  .empty h2{font-size:17px;margin:0 0 8px;color:#94a3b8;font-weight:600}
  .empty p{margin:0;font-size:12.5px;line-height:1.8;max-width:340px}
  .empty kbd{font-family:var(--mono);font-size:11px;background:#172033;border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:#cbd5e1}

  .dwrap{flex:1;display:flex;overflow:auto}
  .dcol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);overflow:auto}
  .dcol:last-child{border-right:0}
  @media(max-width:1180px){.dwrap{flex-direction:column}.dcol{border-right:0;border-bottom:1px solid var(--line)}.dcol.reply{order:-1;border-bottom:0}}
  .bodypre{max-height:180px;overflow:auto;margin:0;padding:10px 12px;background:#080d16;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#cbd5e1;white-space:pre-wrap;word-break:break-word;border-radius:0 0 8px 8px}
  .bodypre.open{max-height:none}

  .dhead{padding:14px 16px;border-bottom:1px solid var(--line);flex:none;background:rgba(255,255,255,.014)}
  .dhead .r1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dhead .path{font-family:var(--mono);font-size:14px;color:#e6edf8;font-weight:500;word-break:break-all}
  .dhead .meta{margin-top:7px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .dhead .meta span{display:inline-flex;align-items:center;gap:5px}
  .dhead .id{font-family:var(--mono);font-size:11px;color:#64748b;cursor:pointer}
  .dhead .id:hover{color:#a78bfa}

  .panel{padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel:last-child{border-bottom:0;flex:1}
  .ph{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#64748b;margin-bottom:8px}
  .ph .r{margin-left:auto;display:flex;gap:6px}
  .mini{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#94a3b8;cursor:pointer}
  .mini:hover{background:rgba(124,92,255,.16);color:#ddd6fe}
  pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#b8c6dc;white-space:pre-wrap;word-break:break-word;background:#080d16;border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto}
  pre.small{max-height:120px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-family:var(--mono);font-size:11.5px}
  .kv .k{color:#64748b;overflow:hidden;text-overflow:ellipsis}
  .kv .v{color:#b8c6dc;word-break:break-word}
  .none{color:#4b5a70;font-size:12px;font-style:italic}

  /* 回复编辑器 */
  .editor{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto}
  .erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lab{font-size:11px;color:#64748b;width:74px;flex:none;letter-spacing:.6px}
  .input,.select{
    background:#080d16;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12px;color:#dbe4f3;outline:none;min-width:0
  }
  .input:focus,.select:focus{border-color:rgba(124,92,255,.65);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
  .statusbox{width:84px;text-align:center;font-weight:600;color:#6ee7b7}
  .ct{flex:1;min-width:200px}
  .codewrap{position:relative;flex:1;display:flex;min-height:170px}
  textarea#respBody{
    flex:1;width:100%;background:#080d16;border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;
    font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#dbe4f3;resize:none;outline:none;min-height:170px
  }
  textarea#respBody:focus{border-color:rgba(124,92,255,.65);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
  .hint{font-size:11px;color:#4b5a70;margin-left:auto}
  .kbd{font-family:var(--mono);font-size:10.5px;background:#172033;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:#cbd5e1}
  .tpls{display:flex;gap:6px;flex-wrap:wrap}
  .tpl{font-size:11.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#94a3b8;cursor:pointer}
  .tpl:hover{background:rgba(34,211,166,.12);border-color:rgba(34,211,166,.4);color:#6ee7b7}
  .actions{display:flex;gap:8px;align-items:center;padding-top:2px}
  .send{
    padding:9px 22px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:13px;
    background:linear-gradient(135deg,#22d3a6,#0ea5a0);color:#04140f;box-shadow:0 8px 22px -8px rgba(34,211,166,.6)
  }
  .send:hover{filter:brightness(1.07)}
  .send:disabled{opacity:.4;cursor:not-allowed}
  .cancelreq{background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:#cbd5e1;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:12.5px}
  .cancelreq:hover{border-color:rgba(248,113,113,.5);color:#fca5a5;background:rgba(248,113,113,.1)}
  .answernote{font-size:11.5px;color:var(--dim)}

  /* 详情：回复优先 + 原文分页 */
  .dscroll{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
  .dtabs{display:flex;gap:6px;padding:9px 16px;border-bottom:1px solid var(--line);flex:none;position:sticky;top:0;z-index:4;background:rgba(11,16,26,.97);backdrop-filter:blur(6px)}
  .dtab{font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
  .dtab:hover{color:var(--text)}
  .dtab.on{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.4);color:#d8ccff}
  .dtab .n{font-family:var(--mono);font-size:10.5px;color:#64748b;margin-left:3px}
  .sum{margin:12px 16px 0;border:1px solid rgba(124,92,255,.22);border-radius:10px;background:rgba(124,92,255,.055);padding:10px 12px}
  .sum-l{font-size:10.5px;letter-spacing:1px;color:#8b98ad;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;text-transform:uppercase}
  .sum-t{font-size:13px;line-height:1.7;color:#dbe4f3;white-space:pre-wrap;word-break:break-word;max-height:76px;overflow:hidden;font-family:var(--sans)}
  .sum-t.open{max-height:none}
  .sum-a{display:flex;gap:6px;margin-top:8px;align-items:center}
  .sum-empty{color:#64748b;font-size:12.5px;font-style:italic}
  .bodywarn{margin:0 16px;padding:7px 10px;border-radius:8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fcd34d;font-size:11.5px;display:flex;gap:8px;align-items:center}

  /* 登录 / 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(6,9,15,.82);backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:20px}
  .overlay.on{display:grid}
  .modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line-2);border-radius:15px;padding:26px;box-shadow:0 40px 90px -30px #000}
  .modal h2{margin:0 0 6px;font-size:18px;letter-spacing:-.3px}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:12.5px}
  .modal label{display:block;font-size:11.5px;color:#8b98ad;margin:12px 0 5px}
  .modal input[type=text],.modal input[type=password],.modal input[type=number],.modal textarea,.modal select{
    width:100%;background:#080d16;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;outline:none;font-family:var(--mono)
  }
  .modal input:focus,.modal textarea:focus,.modal select:focus{border-color:rgba(124,92,255,.6)}
  .modal .row2{display:flex;gap:10px}
  .modal .row2>*{flex:1}
  .modal .foot{display:flex;gap:8px;margin-top:20px}
  .modal .foot>*{flex:1;justify-content:center;text-align:center}
  .err{color:#fca5a5;font-size:12px;min-height:18px;margin-top:8px}
  .modal .scope{max-height:min(70vh,620px);overflow:auto;padding-right:4px}
  .switch{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:#cbd5e1}
  .switch input{width:16px;height:16px;accent-color:#7c5cff}
  .gridinfo{font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.9;background:#080d16;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .gridinfo b{color:#dbe4f3;font-weight:500}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111c2e;border:1px solid var(--line-2);color:#e6edf8;padding:9px 16px;border-radius:9px;font-size:12.5px;opacity:0;transition:.22s;z-index:80;pointer-events:none;box-shadow:0 18px 40px -16px #000}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 窄屏：队列在上，详情在下 */
  @media(max-width:760px){
    .top{flex-wrap:wrap;gap:8px 10px;padding:9px 12px}
    .top .sep{display:none}
    .top .right{margin-left:auto;gap:6px}
    .tbtn{padding:6px 9px;font-size:12px}
    .stat{order:5;width:100%;margin:0;gap:12px}
    .main{grid-template-columns:minmax(0,1fr);grid-template-rows:44% 56%}
    .queue{border-right:0;border-bottom:1px solid var(--line)}
    .detail{min-height:0}
    .dwrap{flex-direction:column;overflow:auto}
    .dcol{overflow:visible;min-width:0;border-right:0}
    .editor{overflow:visible}
    .lab{width:60px}
    .erow .ct{min-width:0}
    .kv{grid-template-columns:96px 1fr}
    .qlist{padding:6px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="brand" href="/" title="回到站点"><span class="logo">R</span> ReplyAPI</a>
    <span class="sep"></span>
    <span class="conn"><span class="d" id="connDot"></span><span id="connText">连接中…</span></span>
    <div class="stat">
      <span>待回复 <b id="sPending">0</b></span>
      <span>已回复 <b id="sAnswered">0</b></span>
      <span>平均 <b id="sAvg">0s</b></span>
    </div>
    <div class="right">
      <button class="tbtn" id="soundBtn" title="新请求提示音">🔔 提示音</button>
      <button class="tbtn" id="testBtn" title="发起一条模拟调用">⚡ 模拟调用</button>
      <button class="tbtn" id="settingsBtn">⚙ 设置</button>
      <button class="tbtn danger" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="main">
    <aside class="queue">
      <div class="qtabs">
        <button class="qtab on" data-tab="pending">待回复 <span class="n" id="nPending">0</span></button>
        <button class="qtab" data-tab="history">历史 <span class="n" id="nHistory">0</span></button>
      </div>
      <div class="qsearch"><input id="qSearch" type="search" placeholder="搜索路径 / 消息内容 / 请求 id" autocomplete="off"></div>
      <div class="qlist" id="qlist"></div>
    </aside>
    <section class="detail" id="detail"></section>
  </div>
</div>

<!-- 登录 -->
<div class="overlay on" id="loginOverlay">
  <div class="modal">
    <h2>管理员登录</h2>
    <p>控制台密码在启动终端里打印，也可在 <code>data/config.json</code> 查看 <code>adminPassword</code>。</p>
    <form id="loginForm">
      <label>密码</label>
      <input type="password" id="loginPwd" autocomplete="current-password" autofocus>
      <div class="err" id="loginErr"></div>
      <div class="foot"><button class="tbtn primary" type="submit" style="padding:9px">进入控制台</button></div>
    </form>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal" style="max-width:520px">
    <h2>设置</h2>
    <p>改完点保存，立即生效。</p>
    <div class="scope">
      <label>默认等待时长（秒）</label>
      <input type="number" id="setWait" min="5" max="900" step="5">

      <label>API Key</label>
      <div class="row2"><input type="text" id="setKey"><button class="mini" id="copyKeyBtn" type="button" style="flex:none;padding:8px 12px">复制</button></div>
      <div class="switch"><input type="checkbox" id="setPublicKey"><span>在首页公开 Key（方便别人直接调用）</span></div>

      <label>管理员密码</label>
      <input type="password" id="setPwd" placeholder="留空则不修改">

      <label>无人值守自动回复</label>
      <div class="switch"><input type="checkbox" id="setAuto"><span>开启后新请求立即返回下面的固定内容</span></div>
      <div class="row2" style="margin-top:8px">
        <input type="number" id="setAutoStatus" min="100" max="599" placeholder="状态码">
        <input type="text" id="setAutoCt" placeholder="Content-Type">
      </div>
      <label style="margin-top:8px">自动回复内容</label>
      <textarea id="setAutoBody" rows="5" style="font-family:var(--mono);font-size:12px"></textarea>

      <div class="gridinfo" id="infoBox" style="margin-top:16px"></div>
    </div>
    <div class="err" id="setErr"></div>
    <div class="foot">
      <button class="tbtn" type="button" id="setCancel" style="padding:9px">取消</button>
      <button class="tbtn primary" type="button" id="setSave" style="padding:9px">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var state = { pending: [], history: [], stats: {}, config: {}, selected: null, tab: 'pending', sound: true };
  var evtSrc = null;
  var reloadTimer = null;
  var ticker = null;
  var lastPendingIds = new Set();

  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function fmtTime(ts){ var d = new Date(ts); return d.toLocaleTimeString('zh-CN', {hour12:false}); }
  function fmtAgo(ts){
    var s = Math.max(0, Math.round((Date.now() - ts)/1000));
    if(s < 60) return s + 's 前';
    if(s < 3600) return Math.floor(s/60) + 'm 前';
    return Math.floor(s/3600) + 'h 前';
  }
  function truncate(s, n){ s = String(s || '').replace(/\s+/g,' '); return s.length > n ? s.slice(0,n) + '…' : s; }

  function fmtBytes(n){
    n = Number(n) || 0;
    if(n < 1024) return n + ' B';
    if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  /** 当前列表实际显示的行：待回复按新→旧，再套上搜索框过滤 */
  function visibleRows(){
    var rows = state.tab === 'pending' ? state.pending.slice().reverse() : state.history.slice();
    var q = ($('qSearch').value || '').trim().toLowerCase();
    if(q){
      rows = rows.filter(function(r){
        var hay = [r.path, r.method, r.id, r.model,
          r.summary && r.summary.lastUser, r.body,
          r.answer && r.answer.body].join(' ').toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }
    return rows;
  }

  var toastTimer = null;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2000);
  }

  /* ---------------------------------------------------------------- 数据 */

  function loadState(){
    return fetch('/admin/api/state', { credentials: 'same-origin' })
      .then(function(r){
        if(r.status === 401){ showLogin(); throw new Error('unauthorized'); }
        return r.json();
      })
      .then(function(s){
        var prev = new Set(state.pending.map(function(p){ return p.id; }));
        state.pending = s.pending || [];
        state.history = s.history || [];
        state.stats = s.stats || {};
        state.config = s.config || {};
        state.now = s.now || Date.now();

        // 有新请求
        var fresh = state.pending.filter(function(p){ return !prev.has(p.id); });
        if(fresh.length){
          if(state.sound) beep();
          if(state.tab === 'pending' && (!state.selected || !state.pending.some(function(p){ return p.id === state.selected; }))){
            state.selected = state.pending[state.pending.length - 1].id;
          }
          state._newIds = new Set(fresh.map(function(f){ return f.id; }));
        }

        // 已选中的请求被回复了
        if(state.selected && !state.pending.some(function(p){ return p.id === state.selected; }) && state.tab === 'pending'){
          if(fresh.length === 0){
            state.selected = state.pending.length ? state.pending[state.pending.length - 1].id : null;
          }
        }

        renderAll();
        setConn(true);
        document.title = (state.pending.length ? '(' + state.pending.length + ') ' : '') + '控制台 · ReplyAPI';
      })
      .catch(function(e){
        if(String(e.message) === 'unauthorized'){ showLogin(); throw e; }
        setConn(false);
        throw e;
      });
  }

  function scheduleReload(){
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(loadState, 180);
  }

  function setConn(on){
    $('connDot').classList.toggle('on', on);
    $('connText').textContent = on ? '实时连接' : '连接断开';
  }

  function connectSSE(){
    if(evtSrc) try { evtSrc.close(); } catch(e){}
    evtSrc = new EventSource('/admin/api/events');
    evtSrc.onopen = function(){ setConn(true); };
    evtSrc.onerror = function(){ setConn(false); };
    ['new','answered','timeout','cancel'].forEach(function(ev){
      evtSrc.addEventListener(ev, function(){ scheduleReload(); });
    });
  }

  /* ---------------------------------------------------------------- 渲染 */

  function renderAll(){
    $('sPending').textContent = state.pending.length;
    $('sAnswered').textContent = state.stats.answered || 0;
    $('sAvg').textContent = (state.stats.avgReplySeconds || 0) + 's';
    $('nPending').textContent = state.pending.length;
    $('nHistory').textContent = state.history.length;
    syncTabs();

    renderList();
    renderDetail();
    updateTimers();
    if(state._newIds) setTimeout(function(){ state._newIds = null; }, 1600);
  }

  function syncTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('.qtab'), function(t){
      t.classList.toggle('on', t.dataset.tab === state.tab);
    });
  }

  function statusOf(rec){
    if(rec.status === 'pending') return { cls: 'wait', text: '等待中' };
    if(rec.status === 'answered') return { cls: 'ok', text: '已回复' };
    if(rec.status === 'timeout') return { cls: 'to', text: '超时' };
    return { cls: 'cancel', text: '已取消' };
  }

  function renderList(){
    var list = $('qlist');
    var rows = visibleRows();

    if(!rows.length){
      var q0 = ($('qSearch').value || '').trim();
      if(q0){
        list.innerHTML = '<div class="qempty"><span class="big">⌕</span>没有匹配「' + esc(q0) + '」的请求。<br>' +
          '<button class="mini" id="clearSearch" style="margin-top:8px">清除搜索</button></div>';
        $('clearSearch').addEventListener('click', function(){ $('qSearch').value = ''; renderList(); });
        return;
      }
      list.innerHTML = '<div class="qempty"><span class="big">' + (state.tab === 'pending' ? '✓' : '—') + '</span>' +
        (state.tab === 'pending'
          ? '队列是空的。<br>有请求进来会立刻出现在这里。'
          : '还没有已结束的请求。') + '</div>';
      return;
    }

    var html = '';
    rows.forEach(function(r){
      var st = statusOf(r);
      var isNew = state._newIds && state._newIds.has(r.id);
      var sel = state.selected === r.id ? ' sel' : '';
      var preview = '';
      if(state.tab === 'pending'){
        var sm = r.summary || {};
        var bits = [];
        if(sm.messageCount) bits.push(sm.messageCount + ' 条');
        if(sm.tools) bits.push(sm.tools + ' 工具');
        if(sm.bytes) bits.push(fmtBytes(sm.bytes));
        var body = (sm.lastUser && String(sm.lastUser).trim()) || truncate(r.body, 100) || (r.query ? '?' + r.query : '(空请求体)');
        preview = (bits.length ? bits.join(' · ') + ' — ' : '') + body;
      } else {
        preview = r.answer ? truncate(r.answer.body, 100) : '(无回复)';
      }
      html += '<div class="item' + sel + (isNew ? ' new' : '') + '" data-id="' + esc(r.id) + '">' +
        '<div class="l1"><span class="verb v-' + esc(r.method) + '">' + esc(r.method) + '</span>' +
        '<span class="path">' + esc(r.path) + '</span></div>' +
        '<div class="l2"><span class="badge ' + st.cls + '">' + st.text + '</span>' +
        '<span>' + esc(fmtTime(r.receivedAt)) + '</span>' +
        (state.tab === 'pending'
          ? '<span class="time" data-deadline="' + (r.receivedAt + r.waitSeconds * 1000) + '">--:--</span>'
          : '<span class="time">' + (r.answer ? esc(r.answer.status) : '—') + '</span>') +
        '</div>' +
        '<div class="preview">' + esc(preview) + '</div>' +
        '</div>';
    });
    list.innerHTML = html;

    Array.prototype.forEach.call(list.querySelectorAll('.item'), function(el){
      el.addEventListener('click', function(){
        select(el.dataset.id);
      });
    });
  }

  function select(id){
    state.selected = id;
    var rec = findRec(id);
    if(!rec) return;
    if(state.tab === 'pending' && rec.status !== 'pending') state.tab = 'history';
    if(state.tab === 'history' && rec.status === 'pending') state.tab = 'pending';
    Array.prototype.forEach.call(document.querySelectorAll('.qtab'), function(t){
      t.classList.toggle('on', t.dataset.tab === state.tab);
    });
    renderList();
    renderDetail();
    updateTimers();
  }

  function findRec(id){
    for(var i=0;i<state.pending.length;i++) if(state.pending[i].id === id) return state.pending[i];
    for(var j=0;j<state.history.length;j++) if(state.history[j].id === id) return state.history[j];
    return null;
  }

  function deadlineHtml(rec){
    if(rec.status !== 'pending') return '';
    var deadline = rec.receivedAt + rec.waitSeconds * 1000;
    return '<span class="badge wait" id="countdown" data-deadline="' + deadline + '">--:--</span>';
  }

  function headersHtml(h){
    var keys = Object.keys(h || {});
    if(!keys.length) return '<div class="none">无</div>';
    var s = '<div class="kv">';
    keys.forEach(function(k){ s += '<div class="k">' + esc(k) + '</div><div class="v">' + esc(h[k]) + '</div>'; });
    return s + '</div>';
  }

  function prettyBody(rec){
    if(!rec.body) return '<div class="none">（空）</div>';
    var text = rec.body;
    try { text = JSON.stringify(JSON.parse(text), null, 2); } catch(e){}
    return '<pre id="reqBodyPre" class="bodypre">' + esc(text) + '</pre>';
  }

  /** 详情顶部那张摘要卡：只展示“这条请求到底在问什么”，不用去翻整段 JSON */
  function summaryCard(rec){
    var sm = rec.summary || {};
    var text = String(sm.lastUser || '').trim();
    var chips = [];
    if(sm.messageCount) chips.push(sm.messageCount + ' 条消息');
    if(sm.tools) chips.push(sm.tools + ' 个工具');
    if(sm.bytes) chips.push(fmtBytes(sm.bytes));
    return '<div class="sum">' +
      '<div class="sum-l">最新用户消息' + chips.map(function(c){ return '<span>· ' + esc(c) + '</span>'; }).join('') + '</div>' +
      (text
        ? '<div class="sum-t" id="sumText">' + esc(text) + '</div>'
        : '<div class="sum-empty">（没有文本内容：可能只有工具调用或图片）</div>') +
      '<div class="sum-a">' +
        (text.length > 150 ? '<button class="mini" id="sumToggle">展开全文</button>' : '') +
        (text ? '<button class="mini" id="sumCopy">复制这条消息</button>' : '') +
        '<span class="answernote" style="margin-left:auto">回复框就在下面 ↓</span>' +
      '</div>' +
    '</div>';
  }

  function renderDetail(){
    var host = $('detail');
    var rec = state.selected ? findRec(state.selected) : null;

    if(!rec){
      host.innerHTML = '<div class="empty"><div><div class="k">Reply Queue</div>' +
        '<h2>等待一条请求</h2>' +
        '<p>左边队列里点一条请求，这里会出现原始报文和你写回复的地方。<br>' +
        '快捷键：<kbd>j</kbd>/<kbd>k</kbd> 切换 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送回复</p></div></div>';
      return;
    }

    var st = statusOf(rec);
    var editable = rec.status === 'pending';
    var model = rec.model || '';
    var pathLines = '';

    var left =
      '<div class="dcol request">' +
        '<div class="dhead">' +
          '<div class="r1"><span class="verb v-' + esc(rec.method) + '">' + esc(rec.method) + '</span>' +
            '<span class="path">' + esc(rec.path) + '</span>' +
            '<span class="badge ' + st.cls + '">' + st.text + '</span>' + deadlineHtml(rec) +
          '</div>' +
          '<div class="meta">' +
            '<span class="id" id="copyId" title="点击复制请求 id">' + esc(rec.id) + '</span>' +
            '<span>' + esc(fmtTime(rec.receivedAt)) + '</span>' +
            '<span>' + esc(fmtAgo(rec.receivedAt)) + '</span>' +
            (rec.remote ? '<span>来源 ' + esc(rec.remote) + '</span>' : '') +
            (model ? '<span>model ' + esc(model) + '</span>' : '') +
            (rec.stream ? '<span style="color:#fbbf24">stream</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="ph">Query<div class="r"><button class="mini" id="copyQuery">复制</button></div></div>' +
          (rec.query ? '<pre class="small">' + esc(rec.query) + '</pre>' : '<div class="none">无</div>') +
        '</div>' +
        '<div class="panel">' +
          '<div class="ph">请求头</div>' + headersHtml(rec.headers) +
        '</div>' +
        '<div class="panel" style="flex:1">' +
          '<div class="ph">请求体<div class="r">' +
            ((rec.body || '').length > 3000 ? '<button class="mini" id="toggleBody">展开全文</button>' : '') +
            '<button class="mini" id="copyReqBody">复制</button></div></div>' + prettyBody(rec) +
        '</div>' +
      '</div>';

    var right = '<div class="dcol reply">' + summaryCard(rec);
    if(editable){
      right += '<div class="editor">' +
        '<div class="erow"><span class="lab">STATUS</span>' +
          '<input class="input statusbox" id="respStatus" value="200" inputmode="numeric">' +
          '<span class="lab" style="width:auto">Content-Type</span>' +
          '<input class="input ct" id="respCt" list="ctList" value="application/json; charset=utf-8">' +
          '<datalist id="ctList">' +
            '<option value="application/json; charset=utf-8">' +
            '<option value="text/plain; charset=utf-8">' +
            '<option value="text/html; charset=utf-8">' +
            '<option value="text/event-stream; charset=utf-8">' +
            '<option value="application/xml; charset=utf-8">' +
            '<option value="application/octet-stream">' +
          '</datalist>' +
        '</div>' +
        '<div class="erow" style="gap:5px">' +
          '<span class="lab" style="width:64px">快捷</span>' +
          [200,201,400,401,404,418,429,500,503].map(function(c){
            return '<button class="tpl" data-status="' + c + '">' + c + '</button>';
          }).join('') +
        '</div>' +
        '<div class="ph" style="margin:2px 0 0">响应体<div class="r">' +
          '<button class="mini" id="formatJson">格式化 JSON</button>' +
          '<button class="mini" id="clearResp">清空</button>' +
        '</div></div>' +
        '<div class="codewrap"><textarea id="respBody" spellcheck="false" placeholder="在这里写返回给调用方的内容…"></textarea></div>' +
        '<div class="tpls" id="tpls"></div>' +
        (rec.stream
          ? '<div class="answernote" style="color:#fbbf24">流式请求（DSH / OpenAI SDK 常见）：会抽取 JSON 里 <code>choices[0].message.content</code> 按 SSE 分块回放，建议直接用「OpenAI 回复」模板</div>'
          : '') +
        '<div class="erow" style="margin-top:2px">' +
          '<span class="lab" style="width:64px">额外头</span>' +
          '<input class="input" id="respHeaders" style="flex:1" placeholder=\'可选，JSON：{"X-Foo":"bar"}\'>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="send" id="sendBtn">发送回复 <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span></button>' +
          '<button class="cancelreq" id="cancelBtn">忽略请求</button>' +
          '<span class="hint" id="sendHint">调用方正在等待</span>' +
        '</div>' +
      '</div>';
    } else {
      var ans = rec.answer;
      right += '<div class="editor">' +
        '<div class="ph" style="margin-top:0">已发出的回复' +
          '<div class="r"><button class="mini" id="copyAnswer">复制</button></div>' +
        '</div>' +
        '<div class="erow"><span class="lab">STATUS</span><span class="badge ok" style="font-size:12px">' +
          (ans ? esc(ans.status) : '—') + '</span>' +
          '<span class="lab" style="width:auto">Content-Type</span>' +
          '<span class="answernote">' + (ans ? esc(ans.contentType || '') : '') + '</span>' +
        '</div>' +
        '<pre style="max-height:none;flex:1">' + (ans ? esc(ans.body) : '<span class="none">' + (rec.status === 'timeout' ? '等待超时，没有回复' : '请求被取消，没有回复') + '</span>') + '</pre>' +
        '<div class="erow"><span class="lab">耗时</span><span class="answernote">' +
          (rec.finishedAt ? ((rec.finishedAt - rec.receivedAt)/1000).toFixed(1) + 's' : '—') +
          ' · ' + (rec.answeredBy === 'auto' ? '自动回复' : '人工回复') +
        '</span></div>' +
        (ans && ans.headers && Object.keys(ans.headers).length
          ? '<div class="ph">额外响应头</div>' + headersHtml(ans.headers) : '') +
      '</div>';
    }
    right += '</div>';

    host.innerHTML = '<div class="dwrap">' + left + right + '</div>';
    bindDetail(rec);
  }

  function bindDetail(rec){
    var el = $('copyId');
    if(el) el.addEventListener('click', function(){
      copy(rec.id); toast('已复制请求 id');
    });
    var q = $('copyQuery');
    if(q) q.addEventListener('click', function(){ copy(rec.query || ''); toast('已复制'); });
    var rb = $('copyReqBody');
    if(rb) rb.addEventListener('click', function(){ copy(rec.body || ''); toast('已复制'); });
    var tb = $('toggleBody');
    if(tb) tb.addEventListener('click', function(){
      var pre = $('reqBodyPre');
      if(!pre) return;
      var open = pre.classList.toggle('open');
      tb.textContent = open ? '收起' : '展开全文';
    });
    var stg = $('sumToggle');
    if(stg) stg.addEventListener('click', function(){
      var t = $('sumText');
      if(!t) return;
      var open = t.classList.toggle('open');
      stg.textContent = open ? '收起' : '展开全文';
    });
    var scap = $('sumCopy');
    if(scap) scap.addEventListener('click', function(){
      copy((rec.summary && rec.summary.lastUser) || ''); toast('已复制这条消息');
    });

    if(rec.status !== 'pending'){
      var ca = $('copyAnswer');
      if(ca) ca.addEventListener('click', function(){ copy(rec.answer ? rec.answer.body : ''); toast('已复制'); });
      return;
    }

    // 状态码快捷
    Array.prototype.forEach.call(document.querySelectorAll('[data-status]'), function(b){
      b.addEventListener('click', function(){
        $('respStatus').value = b.dataset.status;
        var s = Number(b.dataset.status);
        if(s === 200) $('respCt').value = 'application/json; charset=utf-8';
        else if(s === 204) $('respCt').value = 'text/plain; charset=utf-8';
      });
    });

    // 模板
    templates(rec).forEach(function(t){
      var b = document.createElement('button');
      b.className = 'tpl';
      b.textContent = t.name;
      b.addEventListener('click', function(){
        var out = t.build(rec);
        $('respStatus').value = out.status;
        $('respCt').value = out.contentType;
        $('respBody').value = out.body;
        if(out.headers) $('respHeaders').value = JSON.stringify(out.headers);
      });
      $('tpls').appendChild(b);
    });

    $('formatJson').addEventListener('click', function(){
      var ta = $('respBody');
      try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); toast('已格式化'); }
      catch(e){ toast('不是合法 JSON'); }
    });
    $('clearResp').addEventListener('click', function(){ $('respBody').value = ''; });

    $('sendBtn').addEventListener('click', sendAnswer);
    $('cancelBtn').addEventListener('click', function(){ cancelReq(rec.id); });
    var ta = $('respBody');
    ta.addEventListener('keydown', function(e){
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); sendAnswer(); }
    });
    setTimeout(function(){ ta.focus(); }, 30);
  }

  function templates(rec){
    var isChat = /chat\/completions/.test(rec.path);
    var model = rec.model || 'reply-1';
    var id = 'chatcmpl-' + (rec.id || '').slice(-12);
    return [
      { name: 'OpenAI 回复', build: function(r){
        return {
          status: 200, contentType: 'application/json; charset=utf-8',
          body: JSON.stringify({
            id: id, object: 'chat.completion', created: Math.floor(Date.now()/1000), model: model,
            choices: [{ index: 0, message: { role: 'assistant', content: '这是人工回复的内容。' }, finish_reason: 'stop' }],
            usage: { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 }
          }, null, 2)
        };
      }},
      { name: 'JSON 成功', build: function(){
        return { status: 200, contentType: 'application/json; charset=utf-8', body: '{\n  "ok": true\n}' };
      }},
      { name: '纯文本', build: function(){
        return { status: 200, contentType: 'text/plain; charset=utf-8', body: '收到，这是人工回复。' };
      }},
      { name: '回显请求体', build: function(r){
        var b = r.body;
        try { b = JSON.stringify(JSON.parse(b), null, 2); } catch(e){}
        return { status: 200, contentType: r.headers['content-type'] || 'application/json; charset=utf-8', body: b || '' };
      }},
      { name: '404 错误', build: function(){
        return { status: 404, contentType: 'application/json; charset=utf-8', body: JSON.stringify({ error: { message: 'Not Found', type: 'not_found', code: 404 } }, null, 2) };
      }},
      { name: '429 限流', build: function(){
        return { status: 429, contentType: 'application/json; charset=utf-8', body: JSON.stringify({ error: { message: 'Too Many Requests', type: 'rate_limit', code: 429 } }, null, 2) };
      }},
      { name: isChat ? 'SSE 片段' : '空 204', build: function(){
        if(isChat) return { status: 200, contentType: 'text/plain; charset=utf-8', body: 'hi' };
        return { status: 204, contentType: 'text/plain; charset=utf-8', body: '' };
      }}
    ];
  }

  function sendAnswer(){
    if(!state.selected) return;
    var rec = findRec(state.selected);
    if(!rec || rec.status !== 'pending') return;

    var status = parseInt($('respStatus').value, 10);
    if(!(status >= 100 && status <= 599)){ toast('状态码不合法'); return; }
    var body = $('respBody').value;
    var headers = {};
    var rawH = $('respHeaders').value.trim();
    if(rawH){
      try { headers = JSON.parse(rawH) || {}; }
      catch(e){ toast('额外响应头不是合法 JSON'); return; }
    }
    var btn = $('sendBtn');
    btn.disabled = true;
    btn.textContent = '发送中…';
    fetch('/admin/api/answer', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: rec.id, status: status, body: body,
        contentType: $('respCt').value || 'application/json; charset=utf-8',
        headers: headers
      })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if(!res.ok) throw new Error(res.j.error || '发送失败');
        toast('已回复 ' + rec.id);
        state.selected = null;
        loadState();
      })
      .catch(function(e){
        toast(e.message);
        btn.disabled = false;
        btn.innerHTML = '发送回复 <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span>';
      });
  }

  function cancelReq(id){
    fetch('/admin/api/cancel', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function(){ toast('已忽略该请求'); state.selected = null; loadState(); })
      .catch(function(e){ toast('操作失败：' + e.message); });
  }

  /* ---------------------------------------------------------------- 计时 */

  function updateTimers(){
    var now = Date.now();
    Array.prototype.forEach.call(document.querySelectorAll('[data-deadline]'), function(el){
      var left = Math.max(0, Math.round((Number(el.dataset.deadline) - now) / 1000));
      var m = Math.floor(left / 60), s = left % 60;
      var txt = m + ':' + (s < 10 ? '0' : '') + s;
      if(el.classList.contains('badge')){
        if(left === 0) txt = '超时';
        else if(left < 30) txt = '⏳ ' + txt;
      }
      el.textContent = txt;
      if(el.classList.contains('badge')) el.classList.toggle('hot', left < 30);
    });
  }

  /* ---------------------------------------------------------------- 交互 */

  document.querySelectorAll('.qtab').forEach(function(t){
    t.addEventListener('click', function(){
      if(state.tab === t.dataset.tab) return;
      state.tab = t.dataset.tab;
      document.querySelectorAll('.qtab').forEach(function(x){ x.classList.toggle('on', x === t); });
      state.selected = null;
      renderAll();
    });
  });

  $('qSearch').addEventListener('input', function(){
    renderList();
  });

  $('soundBtn').addEventListener('click', function(){
    state.sound = !state.sound;
    $('soundBtn').classList.toggle('off', !state.sound);
    localStorage.setItem('replyapi_sound', state.sound ? '1' : '0');
    toast(state.sound ? '提示音已开启' : '提示音已关闭');
  });

  $('testBtn').addEventListener('click', function(){
    $('testBtn').disabled = true;
    fetch('/admin/api/test', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: '{}' })
      .then(function(r){ return r.json(); })
      .then(function(j){ toast(j.ok ? '已发出一条模拟请求，看左边队列' : ('失败：' + j.error)); })
      .catch(function(e){ toast('失败：' + e.message); })
      .finally(function(){ $('testBtn').disabled = false; });
  });

  $('logoutBtn').addEventListener('click', function(){
    fetch('/admin/api/logout', { method: 'POST', credentials: 'same-origin' }).finally(function(){ location.reload(); });
  });

  // 登录
  function showLogin(){
    $('loginOverlay').classList.add('on');
    try { evtSrc && evtSrc.close(); } catch(e){}
    evtSrc = null;
  }
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    $('loginErr').textContent = '';
    fetch('/admin/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('loginPwd').value })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if(!res.ok){ $('loginErr').textContent = res.j.error || '登录失败'; return; }
        $('loginOverlay').classList.remove('on');
        $('loginPwd').value = '';
        boot();
      })
      .catch(function(e){ $('loginErr').textContent = '请求失败：' + e.message; });
  });

  // 设置
  function openSettings(){
    var c = state.config;
    $('setWait').value = c.waitSeconds || 180;
    $('setKey').value = c.apiKey || '';
    $('setPublicKey').checked = !!c.publicKey;
    $('setPwd').value = '';
    $('setAuto').checked = !!(c.autoReply && c.autoReply.enabled);
    $('setAutoStatus').value = c.autoReply ? c.autoReply.status : 200;
    $('setAutoCt').value = c.autoReply ? c.autoReply.contentType : 'application/json; charset=utf-8';
    $('setAutoBody').value = c.autoReply ? c.autoReply.body : '';
    $('setErr').textContent = '';
    $('infoBox').innerHTML =
      '站点地址  <b>' + esc(location.origin) + '/</b><br>' +
      '接口前缀  <b>/v1/* · /api/* · /mock/*</b><br>' +
      '待回复    <b>' + state.pending.length + '</b> 条 · 历史 <b>' + state.history.length + '</b> 条';
    $('settingsOverlay').classList.add('on');
  }
  $('settingsBtn').addEventListener('click', openSettings);
  $('setCancel').addEventListener('click', function(){ $('settingsOverlay').classList.remove('on'); });
  $('copyKeyBtn').addEventListener('click', function(){ copy($('setKey').value); toast('Key 已复制'); });

  $('setSave').addEventListener('click', function(){
    var payload = {
      waitSeconds: Number($('setWait').value) || 180,
      publicKey: $('setPublicKey').checked,
      apiKey: $('setKey').value.trim(),
      autoReply: {
        enabled: $('setAuto').checked,
        status: Number($('setAutoStatus').value) || 200,
        contentType: $('setAutoCt').value || 'application/json; charset=utf-8',
        body: $('setAutoBody').value
      }
    };
    var pwd = $('setPwd').value;
    if(pwd) payload.adminPassword = pwd;
    fetch('/admin/api/settings', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if(!res.ok) throw new Error(res.j.error || '保存失败');
        if(res.j.relogin){ toast('密码已修改，请重新登录'); setTimeout(function(){ location.reload(); }, 800); return; }
        $('settingsOverlay').classList.remove('on');
        toast('设置已保存');
        loadState();
      })
      .catch(function(e){ $('setErr').textContent = e.message; });
  });

  document.querySelectorAll('.overlay').forEach(function(ov){
    ov.addEventListener('mousedown', function(e){ if(e.target === ov && ov.id !== 'loginOverlay') ov.classList.remove('on'); });
  });

  // 快捷键
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if(e.key === 'j' || e.key === 'k'){
      var rows = visibleRows();
      if(!rows.length) return;
      var idx = rows.findIndex(function(r){ return r.id === state.selected; });
      idx = e.key === 'j' ? Math.min(rows.length - 1, idx + 1) : Math.max(0, idx - 1);
      if(idx < 0) idx = 0;
      select(rows[idx].id);
    }
    if(e.key === 'Escape'){ $('settingsOverlay').classList.remove('on'); }
  });

  function beep(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      var ctx = beep.ctx || (beep.ctx = new AC());
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.24);
    } catch(e){}
  }

  function copy(text){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }

  /* ---------------------------------------------------------------- 启动 */

  var tickStarted = false;
  function boot(){
    loadState().then(function(){
      $('loginOverlay').classList.remove('on');
      connectSSE();
      if(!tickStarted){ tickStarted = true; ticker = setInterval(function(){ updateTimers(); }, 1000); }
    }).catch(function(){ /* 未登录时静默 */ });
  }

  var savedSound = localStorage.getItem('replyapi_sound');
  if(savedSound === '0'){ state.sound = false; $('soundBtn').classList.add('off'); }

  boot();
})();
</script>
</body>
</html>
